server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/order_service
    username: root
    password: 1234

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka